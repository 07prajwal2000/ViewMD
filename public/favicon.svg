<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="viewmd-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accent-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Background Squircle with subtle gradient and inner border -->
  <rect x="16" y="16" width="224" height="224" rx="54" fill="url(#viewmd-grad)" />
  <rect x="17.5" y="17.5" width="221" height="221" rx="52.5" fill="none" stroke="url(#accent-stroke)" stroke-width="3" />

  <!-- Markdown Core Emblem in Crisp Pure White -->
  <g fill="#ffffff" filter="url(#shadow)">
    <!-- 'M' Glyphs -->
    <path d="M40 86 h18 l28 34 l28 -34 h18 v84 h-18 v-48 l-28 34 l-28 -34 v48 h-18 z" />
    <!-- Down Arrow '↓' -->
    <path d="M175 86 h18 v48 h23 l-32 36 l-32 -36 h23 z" />
  </g>
</svg>
